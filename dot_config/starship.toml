"$schema" = 'https://starship.rs/config-schema.json'

format = '''
[┌\[ $directory \](─\[ $git_branch \])(─\[ $python \])(─\[ $nix_shell \])$fill\[ ($username$hostname )$shell $time \](─\[( $status)( $cmd_duration) \])
└\[ ](bold red)
'''

add_newline = false

##{
# R1 Left Modules
#

[directory]
format = '[$path]($style)'
style = "bright-yellow"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'
style = "bright-cyan"

[python]
format = '([$symbol$virtualenv]($style))'
symbol = " "

[nix_shell]
format = '[$symbol$state( \($name\))]($style)'
style = "bold cyan"
symbol = "󱄅 "

##}

[fill]
symbol = "─"
style = "bold red"

##{
# R1 Right Modules
#

[username]
format = '([$user]($style)[@](bold cyan))'
style_root = "blink bold yellow"

[hostname]
format = '[$hostname]($style)'
style = 'bold blue'

[os]
style = "bold cyan"

[os.symbols]
NixOS = ""

[shell]
format = '$indicator'
disabled = false
nu_indicator = "[ü](bold green)"
fish_indicator = "[󰻳](bold blue)"
bash_indicator = "[](bold green)"

[time]
disabled = false
format = "[$time]($style)"
style = "bold purple"

[cmd_duration]
format = '[$duration]($style)'

[status]
disabled = false
format = '[$symbol$status]($style)'
symbol = ''
